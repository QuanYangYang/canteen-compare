<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5c45">
  <meta name="app-version" content="__BUILD__">
  <meta name="apple-mobile-web-app-title" content="询价比价B1">
  <title>武汉大功率机车检修段 · 询价比价系统手机端B1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/logo-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn top-back" id="back-btn" type="button" aria-label="返回" hidden>‹</button>
    <span class="brand-credit">QuanYangYang制作 · 引用请注明</span>
    <button class="top-location" id="top-location" type="button" data-close-x hidden>比价单：<span id="top-location-code">—</span></button>
  </header>

  <main id="view" class="view"></main>

  <footer class="app-footer">
    <div class="browser-list">
      <span>推荐浏览器</span>
      <span>Safari（iPhone）</span>
      <span>Chrome（Android）</span>
      <span>Edge（Windows/Android）</span>
    </div>
    <div class="footer-note">微信内置浏览器可能不支持完整相机/相册/导出功能。</div>
    <div class="footer-note">武汉大功率机车检修段询价比价系统手机端B1 · QuanYangYang制作</div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><span id="busy-text">处理中…</span></div>

  <input id="file-note" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="file-photo" type="file" accept="image/*" capture="environment" multiple hidden>

  <script src="vendor/cpexcel.js"></script>
  <script src="vendor/xlsx.bundle.js"></script>
  <script src="vendor/fflate.umd.js"></script>
  <script src="workbook.js"></script>
  <script src="app.js"></script>
</body>
</html>
